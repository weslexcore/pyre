<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hours Sign — Pyre Social</title>
    <link rel="stylesheet" href="/shared/reset.css" />
    <link rel="stylesheet" href="/shared/brand.css" />
    <link rel="stylesheet" href="/shared/pages.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="/shared/pages.js"></script>
  </head>
  <body>
    <section class="page" data-page="1">
      <section class="hours-sign post">
        <header class="hours-sign__header">
          <h1 class="hours-sign__heading">SUMMER HOURS</h1>
        </header>
        <div class="hours-sign__body">
          <dl class="hours-sign__list">
            <div class="hours-sign__row"><dt>WED</dt><dd>4PM&nbsp;&ndash;&nbsp;8PM</dd></div>
            <div class="hours-sign__row"><dt>THURS</dt><dd>4PM&nbsp;&ndash;&nbsp;8PM</dd></div>
            <div class="hours-sign__row"><dt>FRI</dt><dd>4PM&nbsp;&ndash;&nbsp;9PM</dd></div>
            <div class="hours-sign__row"><dt>SAT</dt><dd>10AM&nbsp;&ndash;&nbsp;4PM</dd></div>
            <div class="hours-sign__row"><dt>SUN</dt><dd>1PM&nbsp;&ndash;&nbsp;4PM</dd></div>
          </dl>
          <p class="hours-sign__note">Last entry is 1 hour before closing</p>
        </div>
        <div class="hours-sign__pine" role="presentation"></div>
      </section>
    </section>
  </body>
</html>
