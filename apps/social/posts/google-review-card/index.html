<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Google review card · Pyre</title>
    <link rel="stylesheet" href="/shared/reset.css" />
    <link rel="stylesheet" href="/shared/brand.css" />
    <link rel="stylesheet" href="/shared/pages.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="/shared/pages.js"></script>
  </head>
  <body>
    <section class="page" data-page="1">
      <article class="post card">
        <header class="card__header">
          <img class="card__logo" src="/shared/logos/pyre_logo.svg" alt="Pyre" />
          <span class="eyebrow">A small favor</span>
        </header>

        <div class="card__ask">
          <h1 class="display">Feeling good?</h1>
          <p class="body">
            Did the warmth land right?<br />
            A kind review on Google<br />
            lights the way for more.
          </p>
        </div>

        <figure class="card__qr">
          <div class="qr-panel">
            <img src="./assets/review-qr.svg" alt="QR code that opens Pyre's Google review form" />
          </div>
          <figcaption class="qr-caption">Scan to leave a review</figcaption>
        </figure>

        <footer class="footer">
          <span class="footer__cite">pyresauna.com · @pyre_sauna</span>
        </footer>
      </article>
    </section>
  </body>
</html>
