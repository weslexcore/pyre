<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fall Hours Menu — Pyre Social</title>
    <link rel="stylesheet" href="/shared/reset.css" />
    <link rel="stylesheet" href="/shared/brand.css" />
    <link rel="stylesheet" href="/shared/tailwind.css" />
    <link rel="stylesheet" href="/shared/pages.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="/shared/pages.js"></script>
  </head>
  <body>
    <section class="page" data-page="1">
      <div class="hours">
        <h1 class="hours__title">FALL HOURS</h1>
        <dl class="hours__list">
          <div class="hours__row"><dt>WED</dt><dd>4PM&nbsp;&ndash;&nbsp;8PM</dd></div>
          <div class="hours__row"><dt>THURS</dt><dd><span>7AM&nbsp;&ndash;&nbsp;10AM</span><span>4PM&nbsp;&ndash;&nbsp;8PM</span></dd></div>
          <div class="hours__row"><dt>FRI</dt><dd><span>7AM&nbsp;&ndash;&nbsp;10AM</span><span>4PM&nbsp;&ndash;&nbsp;9PM</span></dd></div>
          <div class="hours__row"><dt>SAT</dt><dd>9AM&nbsp;&ndash;&nbsp;8PM</dd></div>
          <div class="hours__row"><dt>SUN</dt><dd>1PM&nbsp;&ndash;&nbsp;8PM</dd></div>
        </dl>
        <p class="hours__note">Last entry is 1 hour before closing</p>
      </div>
    </section>
  </body>
</html>
