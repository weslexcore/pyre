<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rules Sheet — Pyre Social</title>
    <link rel="stylesheet" href="/shared/reset.css" />
    <link rel="stylesheet" href="/shared/brand.css" />
    <link rel="stylesheet" href="/shared/pages.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="/shared/pages.js"></script>
  </head>
  <body>
    <section class="page" data-page="1">
      <section class="rules-sheet post">
        <header class="rules-sheet__header">
          <h1 class="rules-sheet__heading">SAUNA ETIQUETTE</h1>
        </header>
        <ol class="rules-sheet__list">
          <li class="rules-sheet__rule">
            <div class="rules-sheet__row">
              <span class="rules-sheet__number">01</span>
              <span class="rules-sheet__label">
               
                <span class="rules-sheet__name">sit on a towel</span>
              </span>
            </div>
            <!-- <p class="rules-sheet__note">a towel between you and the bench keeps it clean for the next person.</p> -->
          </li>
          <li class="rules-sheet__rule">
            <div class="rules-sheet__row">
              <span class="rules-sheet__number">02</span>
              <span class="rules-sheet__label">
               
                <span class="rules-sheet__name">remove shoes</span>
              </span>
            </div>
            <!-- <p class="rules-sheet__note">keep the benches clean for all to</p> -->
          </li>
          <li class="rules-sheet__rule">
            <div class="rules-sheet__row">
              <span class="rules-sheet__number">03</span>
              <span class="rules-sheet__label">
                
                <span class="rules-sheet__name">keep the door shut</span>
              </span>

            </div>
            <!-- <p class="rules-sheet__note">the heat stays in for you to enjoy. quick in, quick out.</p> -->
          </li>
          <li class="rules-sheet__rule">
            <div class="rules-sheet__row">
              <span class="rules-sheet__number">04</span>
              <span class="rules-sheet__label">
                <span class="rules-sheet__name">no phones or headphones</span>
    </section>
  </body>
</html>
