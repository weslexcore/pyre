<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Summer Launch — Pyre Social</title>
    <link rel="stylesheet" href="/shared/reset.css" />
    <link rel="stylesheet" href="/shared/brand.css" />
    <link rel="stylesheet" href="/shared/tailwind.css" />
    <link rel="stylesheet" href="/templates/product-card/template.css" />
    <link rel="stylesheet" href="/shared/pages.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="/shared/pages.js"></script>
  </head>
  <body>
    <section class="page" data-page="1">
      <section class="tpl-product-card post">
        <div class="aurora" aria-hidden="true"></div>
        <div class="tpl-product-card__body">
          <span class="tpl-product-card__eyebrow">New session · Summer 2026</span>
          <h1 class="tpl-product-card__title">
            Sweat<br />out the<br /><em>longest</em> day.
          </h1>
          <p class="tpl-product-card__lede">
            Solstice social saunas at the river. Doors at 6, steam at sundown.
          </p>
        </div>
        <div class="tpl-product-card__footer">
          <div style="display: flex; align-items: center; gap: 10px;">
            <img src="/shared/logos/pyre_logo.svg" width="30" height="30" />
            <span class="tpl-product-card__brand">PYRE</span>
          </div>
          <span>1000 Westover Hills Blvd.</span>
        </div>
      </section>
    </section>
  </body>
</html>
