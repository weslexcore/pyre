<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>15% off voucher card · Pyre</title>
    <link rel="stylesheet" href="/shared/reset.css" />
    <link rel="stylesheet" href="/shared/brand.css" />
    <link rel="stylesheet" href="/shared/pages.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="/shared/pages.js"></script>
  </head>
  <body>
    <!-- Front: brand mark on black -->
    <section class="page" data-page="1">
      <article class="post card card--front">
        <h1 class="front__wordmark">Pyre</h1>
        <p class="front__tagline">Sauna <span class="front__tagline-plus">+</span> Cold Plunge</p>
        <span class="front__cite">pyresauna.com · @pyre_sauna</span>
      </article>
    </section>

    <!-- Back: the offer + QR -->
    <section class="page" data-page="2">
      <article class="post card card--back">
        <span class="eyebrow">Nice run, want to hang?</span>
        <div class="back__row">
          <div class="offer">
            <h1 class="display">Carytown Run Club gets 15% off SAUNA <span class="offer__scope-plus">+</span> COLD PLUNGE </h1>
            <img class="offer__divider" src="./assets/divider-squiggle.png" alt="" />
            <!-- <p class="offer__scope">SAUNA <span class="offer__scope-plus">+</span> COLD PLUNGE</p> -->
            <p class="code">
              code: <strong class="code__value">CRC1572526</strong>
              <!-- optional — delete this span for cards with no expiration -->
              <span class="code__expiry">use by 8/8/2026</span>
            </p>
          </div>

          <figure class="card__qr">
          <div class="qr-panel">
            <img src="./assets/crc-7252026.png" alt="QR code that opens pyresauna.com" />
          </div>
            <figcaption class="qr-caption">Scan to book</figcaption>
          </figure>
        </div>
      </article>
    </section>
  </body>
</html>
