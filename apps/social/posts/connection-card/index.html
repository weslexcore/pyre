<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Connection card · Pyre</title>
    <link rel="stylesheet" href="/shared/reset.css" />
    <link rel="stylesheet" href="/shared/brand.css" />
    <link rel="stylesheet" href="/shared/pages.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="/shared/pages.js"></script>
  </head>
  <body>
    <!-- Front: the words, nothing else -->
    <section class="page" data-page="1">
      <article class="post card card--front">
        <h1 class="front__words">Made a connection</h1>
      </article>
    </section>

    <!-- Back: the pine mark, nothing else -->
    <section class="page" data-page="2">
      <article class="post card card--back">
        <div class="back__pine" role="img" aria-label="Pyre pine tree"></div>
      </article>
    </section>
  </body>
</html>
