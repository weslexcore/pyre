project_id = "pyre"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Staff sign-in for apps/integrations (astro dev on 4321): magic link / code.
# The staff table is the allowlist — the login route creates a person's auth
# user on their first sign-in — so sign-up itself stays closed. The values
# here are for the local stack; [remotes.production] below overrides the
# URLs for the real project, and `supabase config push` applies both the
# auth settings and the email template there.
[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321/api/auth/callback"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# The email provider stays on (the global enable_signup above is what keeps
# strangers out); the code in the sign-in mail is 6 digits, good for 10 min.
enable_signup = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Sign in to Pyre Admin"
# Relative to the CLI's workdir (apps/), not to this file.
content_path = "./supabase/templates/magic_link.html"

# Local mail catcher: sign-in emails land at http://localhost:54324.
[local_smtp]
enabled = true
port = 54324

# The bell's live inbox channel (staff_notifications_realtime migration).
[realtime]
enabled = true

# The production project (shared by the production and staging deployments
# of apps/integrations, and by Vercel previews). Sign-in links come back to
# whichever deployment asked for them, so every origin is on the allowlist.
[remotes.production]
project_id = "veiklnkeinpvfbxkxjrb"

[remotes.production.auth]
site_url = "https://integrations.pyresauna.com"
additional_redirect_urls = [
  "https://integrations.pyresauna.com/api/auth/callback",
  "https://staging.integrations.pyresauna.com/api/auth/callback",
  "https://pyre-integrations.vercel.app/api/auth/callback",
  "https://*-wes-projects-f29875e5.vercel.app/api/auth/callback",
  "http://localhost:4321/api/auth/callback",
]
