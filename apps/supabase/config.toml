project_id = "pyre"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Staff sign-in for apps/integrations (astro dev on 4321): magic link / code.
# The staff table is the allowlist — the login route creates a person's auth
# user on their first sign-in — so sign-up itself stays closed. The values
# here are for the local stack; [remotes.production] below overrides the
# URLs for the real project, and `supabase config push` applies both the
# auth settings and the email template there.
[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321/api/auth/callback"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# The email provider stays on (the global enable_signup above is what keeps
# strangers out); the code in the sign-in mail is 6 digits, good for 10 min.
enable_signup = true
otp_length = 6
otp_expiry = 600
# Staff can add a password on /admin/account once signed in by email, so a
# lost inbox does not lock them out. A signed-in session is enough to set or
# change it (no reauthentication nonce).
minimum_password_length = 10
secure_password_change = false

[auth.email.template.magic_link]
subject = "Sign in to Pyre Admin"
# Relative to the CLI's workdir (apps/), not to this file.
content_path = "./supabase/templates/magic_link.html"

# Passkeys (experimental in Supabase Auth): added on /admin/account, used from
# the login page. Passkeys are bound to rp_id, so the production value below
# must never change once anyone has enrolled one.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Pyre Admin"
rp_id = "localhost"
rp_origins = ["http://localhost:4321"]

# Local mail catcher: sign-in emails land at http://localhost:54324.
[local_smtp]
enabled = true
port = 54324

# The global upload ceiling every bucket's own file_size_limit sits under.
# SOP video walkthroughs (sop_media migration) go up to 500 MB, so this has
# to be at least that; it is set the same locally and, through `supabase
# config push`, on the production project. Above 50 MB needs the Pro plan:
# on Free the push is refused and uploads stop at 50 MB.
[storage]
enabled = true
file_size_limit = "500MiB"

# The bell's live inbox channel (staff_notifications_realtime migration).
[realtime]
enabled = true

# The production project (shared by the production and staging deployments
# of apps/integrations, and by Vercel previews). Sign-in links come back to
# whichever deployment asked for them, so every origin is on the allowlist.
[remotes.production]
project_id = "veiklnkeinpvfbxkxjrb"

[remotes.production.auth]
site_url = "https://integrations.pyresauna.com"
additional_redirect_urls = [
  "https://integrations.pyresauna.com/api/auth/callback",
  "https://staging.integrations.pyresauna.com/api/auth/callback",
  "https://pyre-integrations.vercel.app/api/auth/callback",
  "https://*-wes-projects-f29875e5.vercel.app/api/auth/callback",
  "http://localhost:4321/api/auth/callback",
]

# Production and staging share this project and both live under rp_id, so a
# passkey made on one works on the other. Vercel preview URLs cannot match it;
# the login page offers previews email and password only (lib/auth/passkey.ts).
[remotes.production.auth.webauthn]
rp_display_name = "Pyre Admin"
rp_id = "integrations.pyresauna.com"
rp_origins = [
  "https://integrations.pyresauna.com",
  "https://staging.integrations.pyresauna.com",
]
