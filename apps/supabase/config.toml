project_id = "pyre"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The integrations admin dashboard (astro dev) is the only Auth consumer.
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321/api/auth/confirm"]
jwt_expiry = 3600
# Staff accounts are created server-side only (apps/integrations
# src/lib/auth/provision.ts); nobody signs themselves up.
enable_signup = false
minimum_password_length = 10
