<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your email - Pyre Sauna/title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #eee;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #ff6b35;
            margin-bottom: 10px;
        }
        .content {
            padding: 40px 0;
            text-align: center;
        }
        .button {
            display: inline-block;
            background-color: #ff6b35;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 20px 0;
        }
        .footer {
            padding-top: 40px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        .small-text {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">PYRE</div>
        <!-- <p>Premium Sauna Experience</p> -->
    </div>
    
    <div class="content">
        <h1>Confirm your email address</h1>
        <p>Thank you for signing up with Pyre! To complete your registration and access your account, please confirm your email address by clicking the button below.</p>
        
        <a href="{{ .ConfirmationURL }}" class="button">Confirm Email Address</a>
        
        <div class="small-text">
            <p>If you didn't create an account with Pyre, you can safely ignore this email.</p>
            <p>If the button doesn't work, you can copy and paste this link into your browser:</p>
            <p style="word-break: break-all; color: #666;">{{ .ConfirmationURL }}</p>
        </div>
    </div>
    
    <div class="footer">
        <p>© 2025 Pyre. All rights reserved.</p>
        <p>This is an automated message, please do not reply to this email.</p>
    </div>
</body>
</html>
