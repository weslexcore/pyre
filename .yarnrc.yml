approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 20160

# Exact versions exempt from the age gate above. Keep each entry pinned to
# one version and say why; delete it once that version is 14 days old.
npmPreapprovedPackages:
  # ai 7.0.105 is the first AI SDK release with experimental_evaluate, which
  # pyre-agents uses to call Jev (typesafe-ai/jev) for shift note
  # classification; the three @ai-sdk packages are the exact versions it
  # pins. Released 2026-09-16; drop these after 2026-09-30.
  - "ai@7.0.105"
  - "@ai-sdk/gateway@4.0.85"
  - "@ai-sdk/provider@4.0.17"
  - "@ai-sdk/provider-utils@5.0.43"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
