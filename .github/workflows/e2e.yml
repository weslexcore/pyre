# End-to-end tests (Playwright) for each app that has a suite, run on PRs
# that touch it. Each app's suite starts its own dev server against mock
# upstreams (see apps/<app>/e2e/ and packages/e2e-utils), so no secrets are
# needed and nothing reaches a real service. Suites that need a database
# (integrations) start a local Supabase stack in Docker from
# apps/supabase/migrations as part of `test:e2e`.
#
# The status check to require on PRs is `E2E` (the `result` job at the end).
#
# Adding an app: give it a `test:e2e` script (see packages/e2e-utils/README.md),
# then add a filter below named after its directory under apps/, and add the
# name to ALL_APPS. The filter name is the matrix value, and the workspace is
# @pyre/<name>.

name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # What a manual run (Actions tab -> Run workflow) tests.
  ALL_APPS: '["landing-page", "integrations"]'

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ github.event_name == 'workflow_dispatch' && env.ALL_APPS || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            landing-page:
              - 'apps/landing-page/**'
              - 'packages/webhook-core/**'
              - 'packages/e2e-utils/**'
              - 'yarn.lock'
              - '.github/workflows/e2e.yml'
            integrations:
              - 'apps/integrations/**'
              - 'apps/supabase/migrations/**'
              - 'apps/supabase/config.toml'
              - 'apps/supabase/templates/**'
              - 'packages/e2e-utils/**'
              - 'packages/webhook-core/**'
              - 'packages/jev/**'
              - 'packages/schedule-core/**'
              - 'packages/signals-core/**'
              - 'yarn.lock'
              - '.github/workflows/e2e.yml'

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps != '' }}
    runs-on: ubuntu-latest
    # The integrations suite pulls Supabase's images and replays every
    # migration before it starts (a few minutes on a cold runner).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    name: e2e (${{ matrix.app }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(yarn workspace @pyre/${{ matrix.app }} playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn workspace @pyre/${{ matrix.app }} playwright install chromium webkit

      # Playwright's system packages (~185 debs, ~140 MB) are cached too. The
      # runner downloads them from Ubuntu's mirrors, which are sometimes slow
      # enough to take 7 minutes, even though installing them takes about 20s.
      # On a hit, apt finds the debs locally and only downloads what's newer.
      # The key is per runner image, so both matrix jobs share one entry.
      - name: Get runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt-debs
          key: apt-playwright-${{ steps.image.outputs.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: apt-playwright-${{ steps.image.outputs.os }}-

      # A mirror can also stall outright (one run sat here for 29 minutes), so
      # apt gives up on a dead connection and retries, and the step has its
      # own timeout well inside the job's.
      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: |
          printf '%s\n' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            'Acquire::Retries "5";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99e2e > /dev/null
          if compgen -G ~/.cache/apt-debs/'*.deb' > /dev/null; then
            sudo cp ~/.cache/apt-debs/*.deb /var/cache/apt/archives/
          fi
          yarn workspace @pyre/${{ matrix.app }} playwright install-deps chromium webkit

      # Only on an exact miss. When both matrix jobs miss, the second save
      # finds the key taken and logs a warning; that's fine.
      - name: Collect apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/apt-debs
          rm -f ~/.cache/apt-debs/*.deb
          if ! sudo cp /var/cache/apt/archives/*.deb ~/.cache/apt-debs/; then
            echo "::warning::No apt packages to cache; the next run downloads them again."
          fi
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/apt-debs
          du -sh ~/.cache/apt-debs

      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/apt-debs
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Run E2E tests
        id: tests
        run: yarn workspace @pyre/${{ matrix.app }} test:e2e

      # Whenever the suite ran, pass or fail: a test that failed and then passed
      # on a retry leaves the job green, and its first-retry trace is only
      # worth anything if it's uploaded.
      - name: Upload report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/playwright-report/
            apps/${{ matrix.app }}/test-results/
          retention-days: 14

      # Flaky tests (failed, then passed on a retry) get a warning annotation
      # and a table in the job summary, from the JSON report the shared config
      # writes in CI (packages/e2e-utils/src/config.ts). Never fails the job.
      - name: Report flaky tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: node packages/e2e-utils/scripts/report-flaky.mjs apps/${{ matrix.app }}/test-results/results.json "e2e (${{ matrix.app }})"

  # One check that always reports, whether or not any suite ran. Require this
  # one in branch protection, not the per-app `e2e (<app>)` jobs: those don't
  # exist on a PR that touches no app with a suite, so a required check with
  # their name would wait forever.
  result:
    name: E2E
    needs: [changes, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the suites passed
        env:
          CHANGES: ${{ needs.changes.result }}
          E2E: ${{ needs.e2e.result }}
          APPS: ${{ needs.changes.outputs.apps }}
        run: |
          echo "changes: $CHANGES, e2e: $E2E, apps: ${APPS:-[]}"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Could not work out which apps changed."
            exit 1
          fi
          # Skipped means no app with a suite changed; nothing to test.
          if [ "$E2E" != "success" ] && [ "$E2E" != "skipped" ]; then
            echo "::error::E2E suites did not pass ($E2E)."
            exit 1
          fi
